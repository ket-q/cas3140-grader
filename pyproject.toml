[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
 
[project]
name = "cas3140-grader"
version = "0.1.2"
description = "Student client for submitting CAS3140 lab work from Jupyter notebooks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]
 
[project.optional-dependencies]
# Lab problems that submit a Python function (dill) or a Qiskit circuit (QPY).
# dill is pinned to the grading server's version. 
functions = ["dill==0.4.1"]
qiskit = ["dill==0.4.1", "qiskit>=1.0"]
 
[tool.hatch.build.targets.wheel]
packages = ["src/cas3140_grader"]
