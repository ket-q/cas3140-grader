[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
 
[project]
name = "cas3140-grader"
version = "0.3.5"
description = "Student client for submitting CAS3140 lab work from Jupyter notebooks."
readme = "README.md"
requires-python = "~=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.5",
	"dill==0.4.1",
	"qiskit==2.5.2",
	"numpy>=2.5.4",
	"beartype",
]
 
[project.optional-dependencies]
functions = []
qiskit = []
 
[tool.hatch.build.targets.wheel]
packages = ["src/cas3140_grader"]
